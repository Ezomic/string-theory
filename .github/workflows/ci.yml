name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run build
      - name: Smoke-test the compiled backend
        run: |
          PORT=5199 node dist-server/main.js &
          sleep 2
          curl --fail http://127.0.0.1:5199/api/session
